name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN="sigil"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then BIN="sigil.exe"; fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN" "dist/sigil-${{ matrix.target }}$( [ '${{ matrix.target }}' = 'x86_64-pc-windows-msvc' ] && echo .exe || echo )"
          cd dist
          tar czf "sigil-${{ matrix.target }}.tar.gz" "sigil-${{ matrix.target }}$( [ '${{ matrix.target }}' = 'x86_64-pc-windows-msvc' ] && echo .exe || echo )"
          cd ..
          echo "SHA256:" > dist/checksums.txt
          sha256sum dist/*.tar.gz >> dist/checksums.txt

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
