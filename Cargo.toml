[package]
name = "sigil-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust + LuaJIT coding agent with a self-evolving harness."
repository = "https://github.com/alitrack/sigil"
rust-version = "1.97"

[[bin]]
name = "sigil"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.33"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
