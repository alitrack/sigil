[package]
name = "sigil-agent"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A Rust + LuaJIT coding agent with a self-evolving harness."
repository = "https://github.com/alitrack/sigil"
rust-version = "1.97"

[[bin]]
name = "sigil"
path = "src/main.rs"

[features]
default = ["lua-ffi"]
# LuaJIT FFI for scripted tools (`ffi` library + require allowlist
# entry). OFF = a containment build: no FFI, no arbitrary C library
# loading from Lua — the sandbox story for untrusted/leveraged
# environments. Default ON: FFI is the core self-evolution capability.
lua-ffi = []
# `plan`: the dynamic-workflow plan DSL (263bd58) — FROZEN, not part of the
# default surface. It is the fourth planning mechanism in the tree and its
# `run_plan` entry point is not wired to the CLI yet; see
# `review-multidomain-263bd58.md` §3.1. Kept compiling behind this feature so
# the work is not lost, and so the default build carries none of its surface.
plan = []


[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0.0"
fd-lock = "4"
futures-util = "0.3.33"
mlua = { version = "0.11", features = ["luajit", "vendored", "serialize", "send"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
