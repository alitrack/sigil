# sigil configuration — copy to ~/.sigil/config.toml
# Precedence: CLI flags > env vars (SIGIL_*) > this file > defaults

[llm]
# model = "deepseek-v4-flash"
# base_url = "http://127.0.0.1:15722/v1"
# api_key = "EMPTY"

[agent]
# max_steps = 10            # tool-call budget per turn (0 = unlimited)
# system_prompt = "..."     # optional override of the default system prompt

# MCP client: spawn stdio MCP servers; their tools become
# mcp_<server>_<tool> in sigil's registry.
# [[mcp.servers]]
# name = "echo"
# command = "python3"
# args = ["/path/to/echo_server.py"]

# Streamable HTTP transport (e.g. duckdb_dash /_mcp):
# [[mcp.servers]]
# name = "duckdb-dash"
# url = "http://localhost:4214/_mcp"
# bearer_token = "secret-token-123"   # optional; sent as Authorization: Bearer
